<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>What’s brewing?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- =========================
       FONTS (WOFF2 + TTF FALLBACK)
       ========================= -->
  <style>
    @font-face {
      font-family: "Miller Text";
      src: url("Miller_Text_Roman.woff2") format("woff2"),
           url("Miller_Text_Roman.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Miller Text";
      src: url("Miller_Text_Bold.woff2") format("woff2"),
           url("Miller_Text_Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Miller Text";
      src: url("Miller_Text_Italic.woff2") format("woff2"),
           url("Miller_Text_Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: "Miller Display";
      src: url("Miller_Display_Light.woff2") format("woff2"),
           url("Miller_Display_Light.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "NY Egyptienne";
      src: url("NY_Egyptienne_Legacy_Romans_Variable.woff2") format("woff2"),
           url("NY_Egyptienne_Legacy_Romans_Variable.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* =========================
       BASE RESET + VARIABLES
       ========================= */
    :root {
      --ink: #000;
      --paper: #fff;
      --muted: rgba(0,0,0,.55);
      --hairline: rgba(0,0,0,.25);
      --accent: rgb(219,40,0);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Miller Text", Georgia, serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* =========================
       GLOBAL MASTHEAD
       ========================= */
    header {
      height: 64px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .logo {
      height: 22px;
      display: block;
    }

    .account-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .account-btn svg {
      width: 16px;
      height: 16px;
    }

    /* =========================
       APP VIEWS (ROUTING)
       ========================= */
    main {
      min-height: calc(100vh - 64px);
    }

    section.view {
      display: none;
      padding: 40px 24px 120px;
    }

    section.view.active {
      display: block;
    }

    /* Utility */
    .centered {
      max-width: 980px;
      margin: 0 auto;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->
  <header>
    <img
      src="https://masonry101.com/wp-content/uploads/2021/05/Three-Dots-300x269.jpg"
      alt="Logo"
      class="logo"
    />

    <button class="account-btn" id="accountBtn" aria-label="Your articles">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" fill="currentColor"></circle>
        <path d="M4 20c1.8-4.2 13.2-4.2 16 0"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"></path>
      </svg>
    </button>
  </header>

  <!-- =========================
       MAIN CONTAINER
       ========================= -->
  <main>

    <!-- LANDING -->
    <section id="view-landing" class="view active"></section>

    <!-- EDITOR -->
    <section id="view-editor" class="view"></section>

    <!-- PREVIEW -->
    <section id="view-preview" class="view"></section>

    <!-- ARTICLE -->
    <section id="view-article" class="view"></section>

    <!-- YOUR ARTICLES -->
    <section id="view-articles" class="view"></section>

  </main>

  <!-- =========================
       ROUTING + STATE (BASE)
       ========================= -->
  <script>
    const views = {
      landing: document.getElementById("view-landing"),
      editor: document.getElementById("view-editor"),
      preview: document.getElementById("view-preview"),
      article: document.getElementById("view-article"),
      articles: document.getElementById("view-articles")
    };

    function showView(name) {
      Object.values(views).forEach(v => v.classList.remove("active"));
      views[name].classList.add("active");
      window.scrollTo(0,0);
    }

    document.getElementById("accountBtn").addEventListener("click", () => {
      showView("articles");
    });

    // Global app state (will be extended)
    const AppState = {
      currentArticleId: null,
      articles: JSON.parse(localStorage.getItem("wb_articles") || "[]")
    };
  </script>
<!-- =========================
     PART 2 — LANDING + EDITOR
     ========================= -->

<style>
  /* =========================
     LANDING
     ========================= */
  .landing {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 64px);
  }

  .landing h1 {
    font-family: "Miller Text", Georgia, serif;
    font-weight: 700;
    font-size: clamp(56px, 7vw, 92px);
    letter-spacing: -0.02em;
    margin: 0 0 20px;
  }

  .type-cursor::after {
    content: "|";
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .landing .cta {
    margin-top: 32px;
    font-size: 20px;
    padding: 16px 44px;
    border: 1px solid var(--ink);
  }

  /* =========================
     EDITOR LAYOUT
     ========================= */
  .editor-wrap {
    max-width: 820px;
    margin: 0 auto;
    position: relative;
  }

  .kicker {
    font-family: "Miller Text";
    text-transform: uppercase;
    letter-spacing: .14em;
    font-size: 12px;
    margin-bottom: 18px;
  }

  .title {
    font-family: "Miller Display", "Miller Text";
    font-weight: 300;
    font-size: clamp(44px, 5vw, 72px);
    line-height: 1.02;
    outline: none;
    margin-bottom: 16px;
  }

  .subhead {
    font-size: 22px;
    color: var(--muted);
    outline: none;
    margin-bottom: 28px;
  }

  .byline {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .body {
    font-size: 20px;
    line-height: 1.7;
    outline: none;
  }

  .body p {
    margin-bottom: 18px;
  }

  /* =========================
     DROP CAP
     ========================= */
  .dropcap p:first-child::first-letter {
    font-family: "NY Egyptienne", Georgia, serif;
    float: left;
    font-size: 78px;
    line-height: .9;
    padding: 8px 10px 0 0;
  }

  /* =========================
     PLUS INSERT BUTTON
     ========================= */
  .plus-btn {
    position: absolute;
    left: -48px;
    top: 6px;
    width: 34px;
    height: 34px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .plus-menu {
    position: absolute;
    left: -12px;
    top: 48px;
    border: 1px solid var(--hairline);
    background: white;
    border-radius: 10px;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .plus-menu button {
    padding: 10px 14px;
    font-size: 14px;
    text-align: left;
  }

  .plus-menu button:hover {
    background: rgba(0,0,0,.05);
  }

</style>

<script>
  /* =========================
     LANDING VIEW
     ========================= */
  const landing = views.landing;
  landing.innerHTML = `
    <div class="landing centered">
      <div>
        <h1><span id="typed"></span><span class="type-cursor"></span></h1>
        <button class="cta" id="startWriting">Start writing</button>
      </div>
    </div>
  `;

  const headlines = [
    "The Alaïa Dress That Turned Heads Last Night",
    "A ‘Superhuman’ President",
    "What Diplomats Are Saying About the U.S.",
    "Why I Love Beyoncé and Hate Jay-Z",
    "The Party Everyone Is Still Talking About",
    "A Quiet Power Shift in Fashion",
    "Why This City Feels Different Again"
  ];

  let h = 0, c = 0;
  function typeLoop() {
    const el = document.getElementById("typed");
    const text = headlines[h];
    if (c <= text.length) {
      el.textContent = text.slice(0, c++);
      setTimeout(typeLoop, 60);
    } else {
      setTimeout(() => {
        c = 0;
        h = (h + 1) % headlines.length;
        el.textContent = "";
        typeLoop();
      }, 1200);
    }
  }
  typeLoop();

  document.getElementById("startWriting").onclick = () => showView("editor");

  /* =========================
     EDITOR VIEW
     ========================= */
  const editor = views.editor;
  editor.innerHTML = `
    <div class="editor-wrap">
      <div class="kicker" contenteditable="true">From the Archives</div>

      <div class="title" contenteditable="true"
        data-placeholder="Title"></div>

      <div class="subhead" contenteditable="true"
        data-placeholder="Subheading"></div>

      <div class="byline">By <span contenteditable="true">Your Name</span></div>

      <button class="plus-btn" id="plusBtn">+</button>
      <div class="plus-menu" id="plusMenu">
        <button data-insert="image">Image (URL)</button>
        <button data-insert="video">YouTube</button>
        <button data-insert="code">Code block</button>
        <button data-insert="pull">Pull quote</button>
      </div>

      <div class="body" id="articleBody" contenteditable="true">
        <p></p>
      </div>
    </div>
  `;

  /* =========================
     PLUS MENU LOGIC
     ========================= */
  const plusBtn = document.getElementById("plusBtn");
  const plusMenu = document.getElementById("plusMenu");
  const bodyEl = document.getElementById("articleBody");

  plusBtn.onclick = (e) => {
    e.stopPropagation();
    plusMenu.style.display =
      plusMenu.style.display === "flex" ? "none" : "flex";
  };

  document.addEventListener("click", () => plusMenu.style.display = "none");

  plusMenu.onclick = (e) => {
    const type = e.target.dataset.insert;
    if (!type) return;

    if (type === "code") {
      bodyEl.innerHTML += "<pre>// code</pre><p></p>";
    }
    if (type === "pull") {
      bodyEl.innerHTML += "<blockquote>A pull quote.</blockquote><p></p>";
    }
    if (type === "image") {
      const url = prompt("Image URL");
      if (url) bodyEl.innerHTML += `<figure><img src="${url}"><figcaption></figcaption></figure><p></p>`;
    }
    if (type === "video") {
      const url = prompt("YouTube URL");
      if (url) {
        const id = url.split("v=")[1];
        bodyEl.innerHTML += `<iframe width="100%" height="400" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe><p></p>`;
      }
    }
  };
</script>
<!-- =========================
     PART 3 — TOOLBAR + PREVIEW
     ========================= -->

<style>
  /* =========================
     FLOATING TOOLBAR
     ========================= */
  .floating-toolbar {
    position: absolute;
    display: none;
    background: #fff;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    z-index: 1000;
  }

  .floating-toolbar button {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 999px;
  }

  .floating-toolbar button:hover {
    background: rgba(0,0,0,.08);
  }

  /* =========================
     PREVIEW CONTROLS
     ========================= */
  .preview-controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    font-size: 14px;
  }

  .pill {
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }

  .pill.active {
    background: var(--ink);
    color: white;
  }

  .meta-input {
    font-size: 14px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--hairline);
    outline: none;
  }

  .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    border: 1px solid var(--hairline);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
  }
</style>

<div class="floating-toolbar" id="toolbar">
  <button data-cmd="bold"><strong>B</strong></button>
  <button data-cmd="italic"><em>I</em></button>
  <button data-cmd="underline"><u>U</u></button>
  <button data-link>🔗</button>
</div>

<script>
  /* =========================
     FLOATING TOOLBAR LOGIC
     ========================= */
  const toolbar = document.getElementById("toolbar");

  document.addEventListener("selectionchange", () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) {
      toolbar.style.display = "none";
      return;
    }

    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();

    if (!views.editor.classList.contains("active")) return;

    toolbar.style.top = window.scrollY + rect.top - 46 + "px";
    toolbar.style.left =
      window.scrollX + rect.left + rect.width / 2 - toolbar.offsetWidth / 2 + "px";

    toolbar.style.display = "flex";
  });

  toolbar.addEventListener("mousedown", e => e.preventDefault());

  toolbar.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;

    if (btn.dataset.cmd) {
      document.execCommand(btn.dataset.cmd);
    }

    if (btn.dataset.link !== undefined) {
      const url = prompt("Paste link URL");
      if (url) document.execCommand("createLink", false, url);
    }

    toolbar.style.display = "none";
  });

  /* =========================
     PREVIEW VIEW
     ========================= */
  const preview = views.preview;

  function renderPreview() {
    const title = document.querySelector(".title").innerHTML;
    const sub = document.querySelector(".subhead").innerHTML;
    const body = document.querySelector(".body").innerHTML;
    const kicker = document.querySelector(".kicker").innerHTML;
    const byline = document.querySelector(".byline").innerHTML;

    preview.innerHTML = `
      <div class="editor-wrap">
        <div class="preview-controls">
          <div class="pill active" id="styleArchive">Archive</div>
          <div class="pill" id="styleModern">Modern</div>
          <input class="meta-input" id="dateInput" placeholder="Oct. 28, 2026">
          <input class="meta-input" id="tagsInput" placeholder="Tags (comma)">
          <button class="pill" id="publishBtn">Publish</button>
        </div>

        <article id="previewArticle">
          <div class="kicker">${kicker}</div>
          <h1 class="title">${title}</h1>
          <div class="subhead">${sub}</div>
          <div class="byline">${byline}</div>
          <div class="body">${body}</div>
        </article>
      </div>
    `;

    document.getElementById("styleArchive").onclick = () => setStyle("archive");
    document.getElementById("styleModern").onclick = () => setStyle("modern");
    document.getElementById("publishBtn").onclick = publishArticle;
  }

  function setStyle(style) {
    AppState.currentStyle = style;
    document.getElementById("styleArchive").classList.toggle("active", style === "archive");
    document.getElementById("styleModern").classList.toggle("active", style === "modern");
  }

  function publishArticle() {
    const article = {
      id: Date.now(),
      title: document.querySelector(".title").innerText,
      body: document.querySelector(".body").innerHTML,
      kicker: document.querySelector(".kicker").innerText,
      byline: document.querySelector(".byline").innerText,
      style: AppState.currentStyle || "archive",
      date: document.getElementById("dateInput").value,
      tags: document.getElementById("tagsInput").value.split(",").map(t => t.trim())
    };

    AppState.articles.push(article);
    localStorage.setItem("wb_articles", JSON.stringify(AppState.articles));
    showView("article");
    renderArticle(article);
  }

  /* =========================
     ARTICLE VIEW
     ========================= */
  const articleView = views.article;

  function renderArticle(article) {
    articleView.innerHTML = `
      <div class="editor-wrap">
        <div class="kicker">${article.kicker}</div>
        <h1 class="title">${article.title}</h1>
        <div class="byline">${article.byline}</div>
        <div class="body">${article.body}</div>
        <div class="tags">
          ${article.tags.map(t => `<span class="tag">${t}</span>`).join("")}
        </div>
      </div>
    `;
  }

  /* =========================
     NAVIGATION
     ========================= */
  document.addEventListener("keydown", e => {
    if (e.metaKey && e.key === "p") {
      e.preventDefault();
      renderPreview();
      showView("preview");
    }
  });
</script>
